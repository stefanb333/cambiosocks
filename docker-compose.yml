# Opciono: lokalni Postgres preko Docker-a (alternativa za `npm run db:local`).
# DATABASE_URL=postgres://postgres:postgres@127.0.0.1:54329/cambio
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cambio
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
