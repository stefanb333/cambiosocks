# Netlify: Next.js se automatski pokreće preko Netlify Next.js adaptera (OpenNext),
# nije potreban plugin u ovom fajlu. Tajne (DATABASE_URL, PAYLOAD_SECRET, S3_*, RESEND_*)
# se unose u Netlify: Site configuration > Environment variables, nikad ovde.

[build]
  # Prvo migracije baze (Neon), pa build. Vidi README > Netlify.
  command = "npm run ci"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--no-deprecation --max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED = "1"

# Admin se nikad ne kešira na CDN-u i ne indeksira.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

# Bezbednosna zaglavlja za ceo sajt: sajt ne sme da se ugradi u tuđi okvir (clickjacking na
# checkout i admin), samo HTTPS (HSTS), bez pogađanja tipa fajla, ograničen referrer i API-ji pregledača.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Strict-Transport-Security = "max-age=31536000"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
