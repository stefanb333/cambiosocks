# Netlify: Next.js radi preko Netlify Next.js adaptera (@netlify/plugin-nextjs, u devDependencies).
# Adapter je naveden izričito: bez njega Netlify ponekad objavi samo statične fajlove, bez
# serverskih funkcija (stranice, API, admin), D-069. Tajne (DATABASE_URL, PAYLOAD_SECRET, S3_*,
# RESEND_*) se unose u Netlify: Project configuration > Environment variables, nikad ovde.

[build]
  # Prvo migracije baze, pa build. Vidi docs/DEMO-NETLIFY.md.
  command = "npm run ci"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--no-deprecation --max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED = "1"

# Admin se nikad ne kešira na CDN-u i ne indeksira.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

# Bezbednosna zaglavlja za ceo sajt: sajt ne sme da se ugradi u tuđi okvir (clickjacking na
# checkout i admin), samo HTTPS (HSTS), bez pogađanja tipa fajla, ograničen referrer i API-ji pregledača.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Strict-Transport-Security = "max-age=31536000"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
